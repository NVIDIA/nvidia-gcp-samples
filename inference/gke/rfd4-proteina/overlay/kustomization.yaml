apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../upstream/deploy/kubernetes
  - storageclass.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        storageClassName: standard-rwo-regional
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        progressDeadlineSeconds: 1800
        template:
          spec:
            nodeSelector:
              cloud.google.com/gke-accelerator: nvidia-tesla-a100
              cloud.google.com/gke-gpu-driver-version: latest
            containers:
              - name: api
                resources:
                  requests:
                    cpu: '4'
                    memory: 64Gi
                    ephemeral-storage: 10Gi
                    nvidia.com/gpu: '1'
                  limits:
                    cpu: '4'
                    memory: 64Gi
                    ephemeral-storage: 10Gi
                    nvidia.com/gpu: '1'
                startupProbe:
                  timeoutSeconds: 5
                  failureThreshold: 180
                readinessProbe:
                  timeoutSeconds: 5
                  failureThreshold: 3
                livenessProbe:
                  timeoutSeconds: 5
                  failureThreshold: 3
